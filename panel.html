  <title>康康熊桌宠控制面板</title>
  <style>

    .primary { color:#fff; background:var(--accent); } .quiet { color:var(--accent); border-color:var(--line); background:#fff; } .danger { color:#fff; background:var(--danger); }

    .section-head { display:flex; align-items:center; gap:10px; margin-bottom:13px; } .section-head .meta { margin-left:auto; color:var(--muted); font-size:12px; }

    .mini-weekdays,.mini-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-top:10px; } .mini-weekdays { color:var(--muted); font-size:11px; text-align:center; }
    .mini-day { position:relative; width:100%; height:26px; min-height:0; padding:3px 0; border:0; border-radius:50%; background:transparent; font-size:12px; } .mini-day.outside { color:#a7b1b7; } .mini-day.today { color:var(--accent); font-weight:800; } .mini-day.selected { color:#fff; background:var(--accent); } .mini-day.has-events::after { position:absolute; bottom:1px; left:50%; width:4px; height:4px; transform:translateX(-50%); border-radius:50%; background:var(--warm); content:""; } .mini-day.selected.has-events::after { background:#fff; }
    .calendar-main { display:flex; min-width:0; min-height:0; flex-direction:column; } .calendar-toolbar { flex:0 0 auto; flex-wrap:wrap; justify-content:space-between; margin-bottom:12px; } .calendar-toolbar .left,.calendar-toolbar .right { display:flex; align-items:center; gap:7px; } .calendar-toolbar h2 { margin:0 8px; font-size:21px; }
    .calendar-stats { color:var(--muted); font-size:12px; } .calendar-weekdays { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--line); border-bottom:0; background:#f6f8f9; } .calendar-weekdays div { padding:9px 10px; color:var(--muted); font-size:12px; font-weight:700; }

    .month-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:repeat(6,minmax(0,1fr)); aspect-ratio:7 / 6; min-height:0; border-left:1px solid var(--line); border-top:1px solid var(--line); background:var(--line); gap:1px; } .calendar-cell { display:flex; min-width:0; min-height:0; padding:7px; overflow:hidden; flex-direction:column; background:var(--surface); cursor:pointer; } .calendar-cell:hover { background:#fbfdff; } .calendar-cell.outside { background:#f7f8f9; } .calendar-cell.selected { box-shadow:inset 0 0 0 2px var(--accent); } .day-number { display:flex; flex:0 0 auto; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; } .outside .day-number { color:#a9b2b8; } .today .day-number span:first-child { display:grid; place-items:center; width:23px; height:23px; border-radius:50%; color:#fff; background:var(--accent); font-weight:800; }
    .cell-events { display:grid; flex:1 1 auto; min-height:0; gap:3px; margin-top:5px; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:#c9c1b3 transparent; } .calendar-cell.outside .cell-events { display:none; } .calendar-cell.outside .day-number span:last-child { display:none; } .event-chip { min-width:0; padding:3px 5px; overflow:hidden; border-left:3px solid var(--accent); border-radius:3px; color:#24516f; background:var(--accent-soft); font-size:11px; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; } .event-chip.disabled { border-left-color:#aab5bc; color:#78858d; background:#eef1f2; text-decoration:line-through; } .event-chip:nth-child(3n) { border-left-color:var(--teal); background:#e8f3fb; } .event-chip:nth-child(3n+2) { border-left-color:var(--warm); background:#fff0f0; } .more-events { overflow:hidden; color:var(--muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .agenda { margin-top:16px; } .agenda-head { justify-content:space-between; margin-bottom:10px; } .agenda-head .meta { color:var(--muted); font-size:12px; } .agenda-list { display:grid; gap:7px; } .agenda-item { display:grid; grid-template-columns:76px minmax(0,1fr) auto; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--surface-soft); } .agenda-time { color:var(--accent); font-weight:750; } .agenda-item.disabled { opacity:.55; } .agenda-title { font-weight:750; } .agenda-desc { margin-top:2px; color:var(--muted); font-size:12px; }
    .calendar-legend { display:grid; gap:8px; } .legend-row { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; } .legend-dot { width:9px; height:9px; border-radius:2px; background:var(--accent); } .legend-dot.teal { background:var(--teal); } .legend-dot.warm { background:var(--warm); }

    .reminder-layout { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr); gap:16px; align-items:stretch; min-height:0; } .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:13px; } .bulk-toolbar { padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); } .bulk-select { display:inline-flex; align-items:center; gap:6px; color:var(--ink); } .bulk-select input,.reminder-select { width:16px; min-height:16px; margin:0; accent-color:var(--accent); }
    .conversation-box { padding:12px; margin-bottom:14px; border:1px solid #b8d4e8; border-radius:6px; background:#f3f9fd; } .conversation-actions { display:flex; align-items:center; gap:8px; margin-top:8px; } .conversation-actions .hint { flex:1; margin:0; }
    .reminder-list,.draft-list { display:grid; gap:8px; } .reminder { display:grid; grid-template-columns:20px 25px minmax(0,1fr) auto; gap:9px; align-items:center; padding:11px; border:1px solid var(--line); border-radius:6px; background:#fff; } .reminder.drag-over { border-top:3px solid var(--warm); } .drag-handle { color:var(--muted); cursor:grab; font-size:18px; text-align:center; } .reminder-title { font-weight:750; } .reminder-desc,.reminder-next { margin-top:2px; color:var(--muted); font-size:12px; } .reminder-actions { display:flex; align-items:center; gap:6px; } .reminder-actions button { min-width:36px; padding:0 8px; } .toggle { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:12px; font-weight:700; } .toggle input { width:16px; min-height:16px; margin:0; accent-color:var(--accent); }
    .draft-section { margin:15px 0; padding:12px; border:1px solid #efb8b9; border-radius:6px; background:#fff6f6; } .draft-section .section-head { margin-bottom:9px; } .draft { display:grid; grid-template-columns:54px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px; border-top:1px solid #f5d8d8; } .draft:first-child { border-top:0; } .draft-preview { width:54px; height:54px; border-radius:4px; object-fit:cover; background:#f7e4e4; } .draft-source { color:var(--warm); font-size:11px; } .draft-title { font-weight:750; } .draft-message { margin-top:2px; overflow:hidden; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; } .draft-actions { display:flex; gap:6px; }
    .editor { display:none; position:fixed; inset:24px; z-index:21; width:min(620px,calc(100% - 48px)); max-height:calc(100vh - 48px); overflow:auto; margin:auto; padding:18px; border:1px solid #d7c9b5; border-radius:9px; background:#f4f0e8; box-shadow:0 18px 50px rgba(47,43,38,.2),0 0 0 100vmax rgba(47,43,38,.32); } .editor.open { display:block; } .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .full { grid-column:1 / -1; } .weekday-row { display:flex; flex-wrap:wrap; gap:7px; margin-top:5px; } .weekday-row label { color:var(--ink); font-weight:600; } .weekday-row input { width:15px; min-height:15px; margin:0 4px 0 0; accent-color:var(--accent); vertical-align:middle; } .editor-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }

    .settings-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:stretch; overflow-y:auto; padding-right:2px; } .settings-grid > * { min-width:0; } .asset-list,.button-editor { display:grid; gap:9px; } .asset { display:grid; grid-template-columns:72px minmax(0,1fr); gap:11px; padding:10px; border:1px solid var(--line); border-radius:6px; background:#fff; } .asset.disabled { opacity:.55; } .thumb { width:72px; height:72px; border-radius:4px; background:#e8edf0; object-fit:contain; } .asset-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; } .asset-meta { margin-top:3px; color:var(--muted); font-size:12px; } .asset-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; } .association-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; } .check-pill { display:inline-flex; align-items:center; gap:5px; padding:4px 6px; border:1px solid var(--line); border-radius:4px; color:var(--ink); cursor:pointer; } .check-pill input { width:14px; min-height:14px; margin:0; accent-color:var(--accent); } .range-row { display:grid; grid-template-columns:1fr 82px; gap:10px; align-items:center; } input[type=range] { padding:0; accent-color:var(--accent); } .switch-row { display:flex; align-items:center; justify-content:space-between; gap:12px; } .switch-row input { width:42px; min-height:22px; accent-color:var(--accent); } .button-row { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:end; padding:10px; border:1px solid var(--line); border-radius:6px; background:#fff; } .button-row textarea { min-height:52px; } .app-info { display:grid; gap:10px; } .app-info-row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:36px; } .app-info-row + .app-info-row { padding-top:10px; border-top:1px solid var(--line); } .app-info-label { color:var(--muted); } .app-info-value { font-weight:750; } .update-row { color:var(--muted); font-size:12px; }
    @media (max-width:1050px) { .calendar-layout { grid-template-columns:190px minmax(0,1fr); } .reminder-layout { grid-template-columns:190px minmax(0,1fr); } }
    @media (max-width:820px) { body { min-width:0; } header { grid-template-columns:1fr auto; gap:8px; padding:10px 14px 0; } .tabs { grid-column:1 / -1; grid-row:2; height:42px; } .tab-button { flex:1; min-width:0; } .status { padding-bottom:10px; } main { padding:14px; } .calendar-layout { grid-template-columns:1fr; } .calendar-sidebar { grid-template-columns:1fr 1fr; } .calendar-sidebar .sidebar-block:last-child { grid-column:1 / -1; } .calendar-cell { padding:5px; } .calendar-weekdays div { padding:7px 5px; } }
    @media (max-width:600px) { .calendar-sidebar { grid-template-columns:1fr; } .calendar-sidebar .sidebar-block:last-child { grid-column:auto; } .calendar-toolbar .left,.calendar-toolbar .right { width:100%; } .calendar-toolbar .right { justify-content:flex-end; } .form-grid { grid-template-columns:1fr; } .full { grid-column:auto; } .reminder { grid-template-columns:20px 22px minmax(0,1fr); } .reminder-actions { grid-column:3; justify-content:flex-end; } .agenda-item { grid-template-columns:65px minmax(0,1fr); } .agenda-item button { grid-column:2; justify-self:end; } }
  </style>
  <style id="blue-theme-and-calendar-views">

    button { border-color:transparent; border-radius:6px; background:#e9e4d9; }

    .calendar-view-panel[hidden] { display:none; } .day-view { display:grid; gap:12px; } .day-view-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:4px 2px; } .day-view-head h3 { font-size:18px; } .day-view-head span { color:var(--muted); font-size:12px; }
    .day-view-timeline { display:grid; gap:8px; } .day-view-timeline .agenda-item { background:var(--surface); }
    .year-view-head { display:flex; align-items:baseline; justify-content:space-between; margin:3px 0 10px; } .year-view-head h3 { font-size:18px; } .year-view-head span { color:var(--muted); font-size:12px; }
    .year-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; } .year-month { min-width:0; padding:11px; border:1px solid var(--line); border-radius:7px; background:var(--surface); } .year-month-title { width:100%; min-height:30px; padding:0; color:var(--accent); background:transparent; font-weight:800; text-align:left; } .year-weekdays,.year-days { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-top:7px; } .year-weekdays { color:var(--muted); font-size:10px; text-align:center; } .year-day { position:relative; min-height:23px; padding:2px 0; border:0; border-radius:4px; background:transparent; color:var(--ink); font-size:11px; } .year-day.outside { color:#afa79b; } .year-day.today { color:#fff; background:var(--accent); font-weight:800; } .year-day.selected { box-shadow:inset 0 0 0 2px var(--accent); } .year-day.has-events::after { position:absolute; right:2px; bottom:2px; width:4px; height:4px; border-radius:50%; background:var(--warm); content:""; }
    .drop-target { box-shadow:inset 0 0 0 2px var(--warm) !important; background:#faecea !important; } .event-chip[draggable="true"] { cursor:grab; } .event-chip.dragging { opacity:.45; }
    html,body { height:100%; overflow:hidden; } main { min-height:0; } #calendarTab { display:flex; min-height:0; flex-direction:column; } #calendarTab:not(.active) { display:none; } .today-overview { display:flex; min-height:0; overflow:hidden; flex-direction:column; } .today-agenda { min-height:0; overflow-y:auto; flex:1 1 auto; scrollbar-width:thin; scrollbar-color:#c9c1b3 transparent; } .calendar-view-panel { min-height:0; } #calendarMonthView { display:flex; min-height:0; flex:1 1 auto; flex-direction:column; } #calendarMonthView[hidden] { display:none; } #calendarMonthView .month-grid { flex:1 1 auto; min-height:0; } #calendarDayView { flex:1 1 auto; overflow:auto; } #calendarYearView { flex:1 1 auto; overflow:auto; }
    /* Keep the calendar usable at every supported panel size. Only dense lists scroll. */

    .reminder-layout { grid-template-columns:clamp(168px, 19vw, 230px) minmax(0, 1fr); gap:12px; min-height:100%; align-items:stretch; }
    .reminder-sidebar { display:grid; gap:10px; min-width:0; }
    .reminder-sidebar .sidebar-block { min-height:0; padding:11px; }
    .reminder-sidebar .sidebar-block:first-child { padding:10px; }

    .calendar-toolbar { margin-bottom:8px; }
    .calendar-toolbar h2 { font-size:19px; }
    .calendar-weekdays div { padding:6px 7px; }
    .month-grid { min-height:0; }

<body>
  <header>
    <div class="brand"><div class="brand-mark" aria-hidden="true">康</div><div><h1>康康熊</h1><small>本地工作台</small></div></div>
    <nav class="tabs" aria-label="控制面板标签">
      <button class="tab-button active" data-tab="calendar" type="button">日历</button>
      <button class="tab-button" data-tab="reminders" type="button">提醒管理</button>
      <button class="tab-button" data-tab="settings" type="button">设置</button>
    </nav>
    <div class="status" id="status" aria-live="polite">本地配置会自动保存</div>
  </header>
  <main>
    <section class="tab active" id="calendarTab">
      <div class="calendar-layout">
        <aside class="calendar-sidebar" id="sharedCalendarSidebar">
          <div class="sidebar-block">
            <div class="mini-head"><button class="icon-button quiet" id="miniPrev" type="button" title="上个月" aria-label="上个月">‹</button><strong id="miniMonthLabel"></strong><button class="icon-button quiet" id="miniNext" type="button" title="下个月" aria-label="下个月">›</button></div>
            <div class="mini-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
            <div class="mini-grid" id="miniCalendar"></div>
          </div>
          <div class="sidebar-block">
            <button class="primary" id="calendarNew" type="button" style="width:100%">＋ 新建日程</button>
            <div style="height:14px"></div><h3>我的日历</h3>
            <div class="calendar-legend" style="margin-top:10px"><div class="legend-row"><span class="legend-dot"></span>康康熊提醒</div><div class="legend-row"><span class="legend-dot teal"></span>重复日程</div><div class="legend-row"><span class="legend-dot warm"></span>来源素材</div></div>
          </div>
          <div class="sidebar-block today-overview">
            <div class="section-head"><div><h3>今日概览</h3><span class="today-date" id="todayDateLabel"></span></div><span class="meta" id="todaySummary"></span></div>
            <div class="today-quick-stats"><div class="today-stat"><strong id="todayTotal">0</strong><span>今日安排</span></div><div class="today-stat"><strong id="todayNext">暂无安排</strong><span>下一项</span></div></div>
            <div id="todayAgenda" class="today-agenda"></div>
          </div>
        </aside>
        <div class="calendar-main">
          <div class="calendar-toolbar"><div class="left"><button class="quiet" id="calendarToday" type="button">今天</button><button class="icon-button quiet" id="calendarPrev" type="button" title="上一页" aria-label="上一页">‹</button><button class="icon-button quiet" id="calendarNext" type="button" title="下一页" aria-label="下一页">›</button><h2 id="monthLabel"></h2><span class="calendar-stats" id="calendarStats"></span></div><div class="right"><select id="calendarView" aria-label="日历视图"><option value="day">日</option><option value="month" selected>月</option><option value="year">年</option></select><button class="primary" id="calendarImport" type="button">导入内容</button></div></div>
          <div class="calendar-view-panel" id="calendarMonthView">
            <div class="calendar-weekdays"><div>星期一</div><div>星期二</div><div>星期三</div><div>星期四</div><div>星期五</div><div>星期六</div><div>星期日</div></div>
            <div class="month-scroll" id="monthScroll"><div class="month-grid" id="monthGrid"></div></div>
          </div>
          <div class="calendar-view-panel day-view" id="calendarDayView" hidden><div class="day-view-head"><h3 id="calendarDayHeading"></h3><span id="calendarDayMeta"></span></div><div class="day-view-timeline agenda-list" id="calendarDayAgenda"></div></div>
          <div class="calendar-view-panel" id="calendarYearView" hidden><div class="year-view-head"><h3 id="yearLabel"></h3><span>点击月份标题查看月视图</span></div><div class="year-grid" id="yearGrid"></div></div>
        </div>
      </div>
    </section>

    <section class="tab" id="remindersTab">
      <div class="reminder-layout">
        <div class="section">
          <div class="section-head"><h2>提醒管理</h2><span class="meta" id="reminderCount"></span></div>
          <div class="toolbar"><button class="primary" id="newReminder" type="button">＋ 新建提醒</button><button id="quickReminder" type="button">快速提醒</button><button id="importReminders" type="button">导入文件</button><button id="exportReminders" type="button">导出备份</button><button id="downloadTemplate" class="quiet" type="button">下载模板</button></div>
          <div class="conversation-box"><label for="conversationInput">对话内容</label><textarea id="conversationInput" rows="3" placeholder="粘贴“明天下午3点提醒我提交周报”或多行待办"></textarea><div class="conversation-actions"><button class="primary" id="parseConversation" type="button">解析并加入日历</button><span class="hint">支持日期、时间、每天、每周等表达；无法确定时间的内容会进入待排期。</span></div></div>
          <div class="toolbar bulk-toolbar" id="bulkActions"><label class="bulk-select" for="selectAllReminders"><input id="selectAllReminders" type="checkbox">全选</label><div class="reminder-view-tools"><label>排序<select id="reminderSort"><option value="manual">手动顺序</option><option value="dateAsc">日期升序</option><option value="dateDesc">日期降序</option><option value="time">下次提醒</option><option value="updated">最近修改</option><option value="title">标题</option></select></label><label>筛选<select id="reminderFilter"><option value="all">全部</option><option value="enabled">启用</option><option value="disabled">停用</option><option value="strong">强提醒</option></select></label></div><button class="quiet" id="enableSelected" type="button">批量启用</button><button class="quiet" id="disableSelected" type="button">批量停用</button><button class="danger" id="deleteSelected" type="button">批量删除</button><button class="quiet" id="clearSelection" type="button">取消选择</button><span class="hint" id="bulkSummary"></span></div>
          <div class="draft-section" id="draftSection"><div class="section-head"><h3>待排期素材</h3><span class="meta" id="draftCount"></span></div><div class="draft-list" id="draftList"></div></div>
          <div class="reminder-list" id="reminderList"></div>
        </div>
        <form class="editor" id="reminderEditor">
          <div class="section-head"><h3 id="editorTitle">新建提醒</h3><span class="meta" id="editorSourceHint"></span></div>
          <input id="reminderId" type="hidden"><input id="draftId" type="hidden">
          <div class="form-grid">
            <label>提醒标题<input id="reminderTitle" maxlength="120" required autocomplete="off"></label>
            <label>通知方式<select id="notificationMode"><option value="both">气泡和系统通知</option><option value="bubble">仅桌宠气泡</option><option value="system">仅系统通知</option></select></label>
            <label class="full">提醒内容<textarea id="reminderMessage" maxlength="1000" placeholder="可选"></textarea></label>
            <label>重复规则<select id="repeat"><option value="daily">每天</option><option value="weekly">每周</option><option value="custom">自定义星期</option><option value="interval">每隔 N 分钟</option><option value="once">指定日期</option></select></label>
            <label id="timeField">时间<input id="reminderTime" type="time" value="09:00"></label>
            <label id="intervalField">间隔分钟<input id="intervalMinutes" type="number" min="1" max="525600" step="1" value="30"></label>
            <label id="dateField">日期<input id="reminderDate" type="date"></label>
            <div class="full" id="weekdayField"><label id="weekdayLabel">星期</label><div class="weekday-row" id="weekdayList"></div></div>
            <label class="full"><span class="toggle"><input id="reminderEnabled" type="checkbox" checked> 启用此提醒</span></label>
            <label class="full"><span class="toggle"><input id="strongReminder" type="checkbox"> 强提醒（需点击确定关闭）</span></label>
          </div>
          <p class="hint" id="ruleHint"></p>
          <div class="editor-actions"><button id="cancelReminder" type="button">取消</button><button class="primary" type="submit">保存提醒</button></div>
        </form>
      </div>
    </section>

    <section class="tab" id="settingsTab">
      <div class="settings-grid">
        <div class="section"><div class="section-head"><h2>桌宠设置</h2></div><label for="sizeRange">桌宠大小</label><div class="range-row"><input id="sizeRange" type="range" min="72" max="260" step="4"><input id="sizeNumber" type="number" min="72" max="260" step="4"></div><div class="switch-row" style="margin-top:16px"><label for="autoLaunch">开机自动启动</label><input id="autoLaunch" type="checkbox"></div></div>
         <div class="section"><div class="section-head"><h2>应用信息</h2></div><div class="app-info"><div class="app-info-row"><span class="app-info-label">当前版本</span><strong class="app-info-value" id="appVersion">加载中...</strong></div><div class="app-info-row update-row"><span id="updateStatus" aria-live="polite">尚未检查更新。</span><span style="display:flex;align-items:center;gap:7px"><button class="quiet" id="releaseNotes" type="button">更新说明</button><button class="quiet" id="checkUpdates" type="button">检查更新</button></span></div></div></div>
        <details class="section asset-library" id="assetLibrary"><summary><span class="summary-title">素材库</span><span class="summary-meta" id="assetCount"></span><button class="primary summary-upload" id="uploadAsset" type="button">上传素材</button></summary><div class="asset-list" id="assetList"></div></details>
        <details class="section interaction-library" id="interactionLibrary"><summary><span class="summary-title">互动按钮</span><span class="summary-meta" id="buttonCount"></span><button class="summary-upload" id="addButton" type="button">＋ 新增</button></summary><div class="button-editor" id="buttonEditor"></div></details>
         <details class="section response-library" id="responseLibrary"><summary><span class="summary-title">回应消息管理</span><span class="summary-meta">点击回应与闲置消息</span></summary><div class="response-editor"><label for="responses">桌宠点击回应</label><textarea id="responses" spellcheck="false"></textarea><p class="hint">每行一条。</p><label for="idleMessages" style="margin-top:14px">闲置自动消息</label><textarea id="idleMessages" spellcheck="false"></textarea></div></details>
      </div>
    </section>
  </main>
  <div class="calendar-modal" id="calendarQuickModal" hidden role="dialog" aria-modal="true" aria-labelledby="calendarQuickModalTitle">
    <div class="calendar-modal-panel">
      <form class="calendar-create-form" id="calendarQuickForm">
        <div class="calendar-create-head"><div class="calendar-create-copy"><strong id="calendarQuickModalTitle">新建日程</strong><span id="calendarQuickDateLabel"></span></div><button class="icon-button quiet" id="calendarQuickClose" type="button" title="关闭" aria-label="关闭">×</button></div>
        <div class="calendar-create-grid"><label>标题<input id="calendarQuickTitle" maxlength="120" required autocomplete="off" placeholder="例如：提交周报"></label><label>日期<input id="calendarQuickDate" type="date" required></label><label>时间<input id="calendarQuickTime" type="time" required></label></div>
        <div class="calendar-create-message"><label>内容（可选）<textarea id="calendarQuickMessage" maxlength="1000" rows="2" placeholder="补充地点、备注或提醒内容"></textarea></label></div>
        <label class="toggle"><input id="calendarQuickStrongReminder" type="checkbox"> 强提醒（需点击确定关闭）</label>
        <div class="calendar-modal-actions"><button class="quiet" id="calendarQuickCancel" type="button">取消</button><button class="primary" type="submit">保存日程</button></div>
      </form>
    </div>
  </div>
  <div class="calendar-modal" id="releaseNotesModal" hidden role="dialog" aria-modal="true" aria-labelledby="releaseNotesTitle">
    <div class="calendar-modal-panel release-notes-panel">
      <div class="calendar-create-head"><div class="calendar-create-copy"><strong id="releaseNotesTitle">更新说明</strong><span>历次版本发布内容</span></div><button class="icon-button quiet" id="releaseNotesClose" type="button" title="关闭" aria-label="关闭">×</button></div>
      <div class="release-notes-list" id="releaseNotesList"></div>
    </div>
  </div>
  <script>

    const api = window.panelApi;
    const $ = (selector) => document.querySelector(selector);
    const weekdayNames = ['周一','周二','周三','周四','周五','周六','周日'];
    const status = $('#status');
    const reminderList = $('#reminderList'); const reminderCount = $('#reminderCount'); const draftList = $('#draftList'); const draftSection = $('#draftSection'); const draftCount = $('#draftCount');
    const editor = $('#reminderEditor'); const selectAllReminders = $('#selectAllReminders'); const enableSelected = $('#enableSelected'); const disableSelected = $('#disableSelected'); const deleteSelected = $('#deleteSelected'); const clearSelection = $('#clearSelection'); const bulkSummary = $('#bulkSummary');
    const assetList = $('#assetList'); const assetCount = $('#assetCount'); const buttonCount = $('#buttonCount'); const buttonEditor = $('#buttonEditor'); const sizeRange = $('#sizeRange'); const sizeNumber = $('#sizeNumber'); const autoLaunch = $('#autoLaunch'); const responses = $('#responses'); const idleMessages = $('#idleMessages'); const appVersion = $('#appVersion'); const updateStatus = $('#updateStatus'); const checkUpdates = $('#checkUpdates'); const releaseNotes = $('#releaseNotes'); const releaseNotesModal = $('#releaseNotesModal'); const releaseNotesClose = $('#releaseNotesClose'); const releaseNotesList = $('#releaseNotesList');
    const calendarQuickModal = $('#calendarQuickModal'); const calendarQuickForm = $('#calendarQuickForm'); const calendarQuickTitle = $('#calendarQuickTitle'); const calendarQuickDate = $('#calendarQuickDate'); const calendarQuickTime = $('#calendarQuickTime'); const calendarQuickMessage = $('#calendarQuickMessage'); const calendarQuickStrongReminder = $('#calendarQuickStrongReminder'); const calendarQuickDateLabel = $('#calendarQuickDateLabel'); const calendarQuickClose = $('#calendarQuickClose'); const calendarQuickCancel = $('#calendarQuickCancel'); const calendarViewSelect = $('#calendarView');
    const todayAgenda = $('#todayAgenda'); const todayDateLabel = $('#todayDateLabel'); const todaySummary = $('#todaySummary'); const todayTotal = $('#todayTotal'); const todayNext = $('#todayNext');
    let config = null; let appInfo = null; let saveTimer = null; let statusTimer = null; let renderLock = false; let draggingId = null; let selectedReminderIds = new Set(); let updateCheckInFlight = false; let monthCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1); let selectedDate = dateKey(new Date()); let calendarView = 'month'; let pendingDraftId = null; let calendarQuickReminder = null; let monthStackResetPending = false; let reminderSortMode = 'manual'; let reminderFilterMode = 'all'; let miniSlideDirection = 0;

    function id() { return crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`; }
    function dateKey(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; }
    function fromKey(key) { const [year, month, day] = String(key).split('-').map(Number); return new Date(year, month - 1, day); }
    function todayKey() { return dateKey(new Date()); }
    function formatMonth(date) { return `${date.getFullYear()}年${date.getMonth() + 1}月`; }
