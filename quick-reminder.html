<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>快速新建提醒</title>
  <style>
    :root{--bg:#f5f3ee;--surface:#fff;--line:#ddd7ca;--ink:#2f2b26;--muted:#746d61;--accent:#24786b;--danger:#b53e35}*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI","Microsoft YaHei",sans-serif}h1{margin:0 0 16px;font-size:19px}label{display:block;margin-top:12px;color:var(--muted);font-weight:700;font-size:12px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;min-height:38px;margin-top:5px;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fffefa;color:var(--ink)}textarea{min-height:70px;resize:vertical}.presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}button{min-height:36px;padding:0 12px;border:0;border-radius:6px;background:#e9e4d9;color:var(--ink);font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.status{min-height:20px;margin-top:10px;color:var(--danger);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}
  </style>
</head>
<body>
  <h1>快速新建提醒</h1>
  <form id="form">
    <label>提醒标题<input id="title" maxlength="120" required autofocus placeholder="例如：提交周报"></label>
    <label>提醒内容<textarea id="message" maxlength="1000" placeholder="可选"></textarea></label>
    <label>提醒时间<select id="mode"><option value="10">10 分钟后</option><option value="30">30 分钟后</option><option value="60">1 小时后</option><option value="custom">自定义分钟</option><option value="once">指定日期时间</option></select></label>
    <div id="customField" class="hidden"><label>分钟<input id="minutes" type="number" min="1" max="525600" value="10"></label></div>
    <div id="onceFields" class="grid hidden"><label>日期<input id="date" type="date"></label><label>时间<input id="time" type="time"></label></div>
    <label>通知方式<select id="notification"><option value="both">气泡和系统通知</option><option value="bubble">仅桌宠气泡</option><option value="system">仅系统通知</option></select></label>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="actions"><button id="cancel" type="button">取消</button><button class="primary" type="submit">保存</button></div>
  </form>
  <script>
    const api=window.quickReminderApi; const $=(s)=>document.querySelector(s); const mode=$('#mode'); const status=$('#status');
    function fields(){ $('#customField').classList.toggle('hidden',mode.value!=='custom'); $('#onceFields').classList.toggle('hidden',mode.value!=='once'); } fields(); mode.addEventListener('change',fields);
    $('#cancel').addEventListener('click',()=>api.cancel()); window.addEventListener('keydown',(event)=>{if(event.key==='Escape')api.cancel()});
    $('#form').addEventListener('submit',async(event)=>{event.preventDefault();const kind=mode.value;const data={title:$('#title').value,message:$('#message').value,notificationMode:$('#notification').value,enabled:true};if(kind==='once'){data.repeat='once';data.date=$('#date').value;data.time=$('#time').value}else{data.repeat='interval';data.intervalMinutes=Number(kind==='custom'?$('#minutes').value:kind)}const result=await api.save(data);if(!result.ok)status.textContent=result.errors.join(' ');});
  </script>
</body>
</html>
