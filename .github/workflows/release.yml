name: Release source verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Explain release packaging
        shell: pwsh
        run: Write-Host 'The bundled FORCOME CLI runtime is not stored in the public source repository. Release installers are built from the verified maintainer workspace and uploaded to GitHub Releases.'
